[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lang-in-out-handler"
version = "0.8.0"
description = "A Linux language workbench with Google handwriting/translation and OpenAI speech."
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8,<7",
    "openai>=2,<3",
    "httpx[socks]>=0.28,<1",
    "keyring>=25",
    "websocket-client>=1.8",
    "imageio-ffmpeg>=0.8.1",
    "python-socks>=2.5",
]

[project.scripts]
lang-in-out = "lang_handler.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/lang_handler"]

[tool.hatch.build.targets.wheel.force-include]
"assets/lang-in-out.svg" = "lang_handler/assets/lang-in-out.svg"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

