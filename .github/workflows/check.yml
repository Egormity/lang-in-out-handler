name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries
        # QtGui links these libraries even when tests use the offscreen platform.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libgl1 libxkbcommon0
      - name: Install
        run: python -m pip install -e . pytest pytest-qt ruff
      - name: Lint
        run: ruff check src tests scripts
      - name: Test
        run: QT_QPA_PLATFORM=offscreen pytest -q
